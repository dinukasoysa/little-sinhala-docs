async function go(pw){try{const h=await open(pw);sessionStorage.setItem("ls-pw",pw);document.open();document.write(h);document.close()}
 catch(e){document.getElementById("m").textContent="That passphrase didn't work.";sessionStorage.removeItem("ls-pw")}}
document.getElementById("f").onsubmit=e=>{e.preventDefault();go(document.getElementById("p").value)};
const saved=sessionStorage.getItem("ls-pw");if(saved)go(saved);
</script></body></html>
