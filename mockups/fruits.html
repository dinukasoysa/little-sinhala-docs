async function open(pw){
 const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
 const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:b(SALT),iterations:ITER,hash:"SHA-256"},k,384));
 const key=await crypto.subtle.importKey("raw",bits.slice(0,32),"AES-CBC",false,["decrypt"]);
 const plain=await crypto.subtle.decrypt({name:"AES-CBC",iv:bits.slice(32,48)},key,b(DATA));
 return new TextDecoder().decode(plain)}
async function go(pw){try{const h=await open(pw);sessionStorage.setItem("ls-pw",pw);document.open();document.write(h);document.close()}
 catch(e){document.getElementById("m").textContent="That passphrase didn't work.";sessionStorage.removeItem("ls-pw")}}
document.getElementById("f").onsubmit=e=>{e.preventDefault();go(document.getElementById("p").value)};
